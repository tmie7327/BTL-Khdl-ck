<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web định giá chứng khoán</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Định giá chứng khoán</h1>
      <p>Nhập dữ liệu cơ bản của công ty để ước tính giá trị nội tại.</p>
    </header>

    <section class="card">
      <h2>Thông tin công ty</h2>
      <label>Công ty</label>
      <input id="companyName" type="text" placeholder="Tên công ty" />

      <label>Giá hiện tại (VNĐ/cổ phiếu)</label>
      <input id="currentPrice" type="number" placeholder="0" min="0" step="0.01" />

      <label>Lợi nhuận trên mỗi cổ phiếu (EPS, VNĐ)</label>
      <input id="eps" type="number" placeholder="0" min="0" step="0.01" />

      <label>Tốc độ tăng trưởng lợi nhuận (%)</label>
      <input id="growthRate" type="number" placeholder="10" min="0" step="0.1" />

      <label>Hệ số P/E mục tiêu</label>
      <input id="targetPE" type="number" placeholder="15" min="1" step="0.1" />

      <label>Tỷ lệ chiết khấu (%)</label>
      <input id="discountRate" type="number" placeholder="10" min="0" step="0.1" />

      <label>Số cổ phiếu đang lưu hành (triệu cổ phiếu)</label>
      <input id="sharesOutstanding" type="number" placeholder="100" min="0" step="0.01" />

      <button id="calculateBtn">Tính giá trị</button>
    </section>

    <section class="card results-card">
      <h2>Kết quả định giá</h2>
      <div class="result-row"><span>Giá trị theo P/E</span><strong id="peValue">-</strong></div>
      <div class="result-row"><span>Giá trị theo DCF</span><strong id="dcfValue">-</strong></div>
      <div class="result-row"><span>Giá trị trung bình</span><strong id="fairValue">-</strong></div>
      <div class="result-row"><span>Đánh giá</span><strong id="valuationLabel">-</strong></div>
      <div class="hint">
        <p>Nhập các chỉ số tài chính cơ bản để xem giá trị nội tại ước tính và so sánh với giá thị trường.</p>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
